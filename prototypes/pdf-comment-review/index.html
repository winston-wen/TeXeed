<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeXeed · 文稿评论原型</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
<header class="top"><div class="brand">TeXeed</div><div class="title" id="window-title">AI 会话</div><span class="prototype">交互原型</span><a id="open-editor" class="window-link action" href="/?view=editor" target="texeed-document-editor">编辑文稿与评论 ↗</a><a id="open-chat" class="window-link" href="/" target="texeed-ai-session">AI 会话 ↗</a></header>
<div class="toolbar"><div class="tabs" role="tablist" aria-label="选择文稿"><button id="tab-session" role="tab" aria-selected="true">会话文稿</button><button id="tab-project" role="tab" aria-selected="false">项目文稿</button></div><span class="bar-spacer"></span><a id="pdf-file" target="_blank" rel="noopener" hidden>打开 PDF</a><button id="compile" class="action">编译并更新预览</button></div>
<main class="workspace">
 <section class="editor pane" aria-label="源码编辑区"><div class="pane-head"><div><span class="caption">源码编辑</span><span class="filename" id="filename">document.tex</span></div><button id="comment-create" title="先在源码中选择一段文字">评论选区</button></div><div class="edit-wrap"><textarea id="source" aria-label="LaTeX 源码" spellcheck="false"></textarea></div><div class="editor-status" id="editor-status">选中源码文字后添加评论</div><div class="comment-editor" id="comment-editor" hidden><div class="comment-editor-head"><span id="editor-title">添加评论</span><button id="cancel-comment" aria-label="关闭评论编辑">×</button></div><blockquote id="comment-quote"></blockquote><textarea id="comment-text" placeholder="写下你的问题或意见…" aria-label="评论内容"></textarea><div class="comment-actions"><button id="save-comment" class="action">保存评论</button></div></div><div class="edit-comments-head">源码评论 <span id="editor-count">0</span></div><div id="edit-comments" class="edit-comments"></div></section>
 <section class="preview pane" aria-label="PDF 预览区"><div class="pane-head"><div><span class="caption" id="preview-title">会话 PDF</span><span id="preview-status" class="filename">尚未编译</span></div><div class="preview-controls"><button id="page-prev" aria-label="上一页">‹</button><span id="page-label" class="read-only">—</span><button id="page-next" aria-label="下一页">›</button><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-fit" title="本原型尚未接入 TeXeed 的预览设置">适宽</button><button id="zoom-in" aria-label="放大">＋</button><span class="read-only">只读预览</span></div></div><div class="preview-body"><div class="pdf-wrap"><div id="pdf-page" hidden><img id="pdf" alt="由 PDF 渲染的页面"><div id="pdf-marker" hidden title="由 SyncTeX 提供的行级近似位置"></div></div><div id="pdf-empty" class="empty"><span class="paper-icon">▤</span><p>编译后在这里预览 PDF</p><small>修改源码后需重新编译，评论定位才会更新。</small></div></div><aside class="review-pane"><div class="review-head">评论 <span id="preview-count">0</span></div><div class="review-help">只读 · 点击定位到 PDF</div><div id="preview-comments"></div></aside></div></section>
</main><section class="chat-composer" aria-label="AI 对话编辑栏"><div id="chat-resize" class="chat-resize" role="separator" aria-orientation="horizontal" aria-label="调整编辑栏高度" tabindex="0"></div><div class="chat-editor"><div class="chat-lines" aria-hidden="true"><div id="chat-line-content"></div></div><textarea id="chat-draft" aria-label="发送给 AI 的附言" title="Enter / Shift+Enter 换行；Ctrl+Enter 发送" spellcheck="false"></textarea><div id="chat-measure" aria-hidden="true"></div></div><div class="chat-bottom"><button id="chat-options" class="chat-icon" aria-label="对话操作" title="对话操作 · 演示"><svg viewBox="0 0 16 16"><path d="M8 1v14M1 8h14"/></svg></button><select id="chat-permission" aria-label="会话权限" title="演示选项，不影响权限"><option>完全访问</option><option>执行前询问</option><option>只读</option></select><span class="chat-spacer"></span><span class="chat-usage" title="原型未连接模型">—</span><select id="chat-model" aria-label="AI 对话模型" title="演示选项，未连接模型"><option>GPT-6.1-Sol</option></select><select id="chat-effort" aria-label="AI 推理强度" title="演示选项，未连接模型"><option>服务端默认</option><option>低</option><option>中</option><option selected>高</option><option>很高</option><option>最高</option></select><button id="chat-send" class="chat-icon chat-send" aria-label="发送附言" title="发送 · Ctrl+Enter"><svg viewBox="0 0 16 16"><path d="M8 15V1M2 7l6-6 6 6"/></svg></button></div><div id="chat-options-menu" class="chat-options-menu" hidden><button data-option="刷新模型">刷新模型</button><button data-option="AI 设置">AI 设置</button></div><div id="chat-status" class="chat-status" role="status"></div></section><footer><span id="footer-status">选择一段源码，添加评论。</span><span>评论只在编辑窗口修改</span></footer>
</div><script src="app.js"></script></body></html>
