name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TeXeed.slnx --locked-mode
      - run: dotnet build TeXeed.slnx -c Release --no-restore
      - run: dotnet run --project tests/TeXeed.Tests -c Release --no-build
      - run: dotnet run --project tests/TeXeed.EditorTests -c Release --no-build
      - run: dotnet run --project tests/TeXeed.PdfTests -c Release --no-build
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build
      - run: ./scripts/publish.ps1 -SkipShortcuts
      - uses: actions/upload-artifact@v4
        with:
          name: TeXeed-win-x64
          path: artifacts/TeXeed
