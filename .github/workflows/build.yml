name: Windows build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Tectonic for WPF integration tests
        run: |
          $url = 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest -Uri $url -OutFile tectonic.zip
          if ((Get-FileHash tectonic.zip -Algorithm SHA256).Hash -ne 'f61ce51f0b0ade1015b7de7ef368541c5424e9756ecbd0d7af97d6d48030845f') { throw 'Tectonic archive checksum mismatch.' }
          Expand-Archive tectonic.zip -DestinationPath .tools/tectonic
          & ./.tools/tectonic/tectonic.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Tectonic failed to start.' }
      - run: dotnet restore TeXeed.slnx -r win-x64 --locked-mode -m:1
      - run: dotnet build TeXeed.slnx -c Release --no-restore -m:1
      - run: dotnet run --project tests/TeXeed.Tests -c Release --no-build
      - run: dotnet run --project tests/TeXeed.EditorTests -c Release --no-build
      - run: dotnet run --project tests/TeXeed.PdfTests -c Release --no-build
      - run: ./tests/release-automation.ps1
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-settings-login-only --output artifacts/ci-ai-settings-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --welcome-only --output artifacts/ci-welcome-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-wheel-bounce-only --output artifacts/ci-ai-wheel-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-control-viewport-offscreen --output artifacts/ci-ai-control-viewport-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-long-form-viewport-only --offscreen --output artifacts/ci-ai-long-form-viewport-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-inline-axis-only --offscreen --output artifacts/ci-ai-inline-axis-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-heading-prompt-only --offscreen --output artifacts/ci-ai-writing-prompt-check
      - run: node prototypes/ai-chat-v02/preview.test.cjs
      - run: node prototypes/ai-chat-v02/turn-metadata.test.cjs
      - name: Exercise paragraph editing and turn folding in Chromium
        run: |
          $deps = Join-Path $env:RUNNER_TEMP 'texeed-browser-tests'
          npm install --prefix $deps --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEXEED_PLAYWRIGHT_PATH = Join-Path $deps 'node_modules/playwright'
          $chrome = Join-Path $env:ProgramFiles 'Google/Chrome/Application/chrome.exe'
          if (Test-Path -LiteralPath $chrome) { $env:TEXEED_BROWSER_PATH = $chrome }
          else {
            node (Join-Path $env:TEXEED_PLAYWRIGHT_PATH 'cli.js') install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node prototypes/ai-chat-v02/turn-revision-browser.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node prototypes/ai-chat-v02/turn-fold-browser.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node prototypes/ai-chat-v02/equation-reference-browser.test.cjs
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-turn-fold-only --offscreen --output artifacts/ci-turn-fold-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --preview-close-restore-only --offscreen --output artifacts/ci-preview-eye-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-eqref-only --offscreen --output artifacts/ci-ai-eqref-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-async-layout-only --output artifacts/ci-ai-layout-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-branches-only --output artifacts/ci-ai-branches-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-revision-source-only --offscreen --output artifacts/ci-revision-sources
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-revision-inline-math-only --offscreen --output artifacts/ci-revision-inline-math
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-inline-math-repair-request-only --offscreen --output artifacts/ci-revision-inline-math-request
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-revision-agent-only --offscreen --output artifacts/ci-revision-agent
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --revision-editor-only --offscreen --output artifacts/ci-revision-editor
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --ai-relations-surface-only --offscreen --output artifacts/ci-ai-relations-check
      - run: dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --workspace-restore-only --offscreen --output artifacts/ci-workspace-restore-check
      - name: Upload workspace tab diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: TeXeed-workspace-tab-diagnostics
          path: |
            artifacts/ci-ai-eqref-check/*.png
            artifacts/ci-ai-relations-check/*.png
            artifacts/ci-workspace-restore-check/*.png
            artifacts/ci-turn-fold-check/*.png
            artifacts/ci-preview-eye-check/*.png
            artifacts/ci-revision-editor/*.png
          if-no-files-found: ignore
      - run: ./scripts/publish.ps1 -SkipShortcuts -NoRestore
      - name: Package release
        id: package
        run: ./scripts/package-release.ps1 -ExpectedCommit $env:GITHUB_SHA
      - uses: actions/upload-artifact@v6
        with:
          name: TeXeed-release-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error

  full-ui-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Tectonic for WPF integration tests
        run: |
          $url = 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest -Uri $url -OutFile tectonic.zip
          if ((Get-FileHash tectonic.zip -Algorithm SHA256).Hash -ne 'f61ce51f0b0ade1015b7de7ef368541c5424e9756ecbd0d7af97d6d48030845f') { throw 'Tectonic archive checksum mismatch.' }
          Expand-Archive tectonic.zip -DestinationPath .tools/tectonic
          & ./.tools/tectonic/tectonic.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Tectonic failed to start.' }
      - run: dotnet restore TeXeed.slnx -r win-x64 --locked-mode -m:1
      - run: dotnet build tests/TeXeed.AppTests/TeXeed.AppTests.csproj -c Release --no-restore -m:1
      - name: Run full WPF integration suite
        run: |
          New-Item -ItemType Directory -Force artifacts/ci-ui-check | Out-Null
          dotnet run --project tests/TeXeed.AppTests -c Release --no-build -- --output artifacts/ci-ui-check 2>&1 |
            Tee-Object -FilePath artifacts/ci-ui-check/regression.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: TeXeed-full-ui-diagnostics
          path: |
            artifacts/ci-ui-check/*.log
            artifacts/ci-ui-check/*.png
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, full-ui-regression]
    runs-on: windows-latest
    concurrency:
      group: release-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: TeXeed-release-${{ github.sha }}
          path: artifacts/release
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: ./scripts/release-github.ps1 -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY
