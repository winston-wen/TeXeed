<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共同文稿</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css"><link rel="stylesheet" href="mentor.css"><link rel="stylesheet" href="document.css"><link rel="stylesheet" href="bookmarks.css"></head>
<body><div class="app"><main class="workspace"><div class="document-toolbar" aria-label="文稿工具">
<span class="toolbar-label">共同文稿</span><button id="mentor-source-toggle" type="button" aria-pressed="false">LaTeX 源码</button><button id="host-version" type="button">版本</button><span class="toolbar-spacer"></span><button id="mentor-comment-add" type="button">评论选区</button><button id="mentor-comments-toggle" type="button" aria-expanded="true">评论</button><span id="mentor-demo" hidden></span></div>
<div class="work-area"><section class="document-pane" aria-label="共同文稿"><div class="document-scroll"><div id="mentor-empty" hidden></div><div id="mentor-initial-question" class="initial-question" hidden></div><article id="mentor-document" class="mentor-document" aria-label="可编辑文稿"></article><textarea id="mentor-source-view" class="source-view" aria-label="LaTeX 源码" spellcheck="false" hidden></textarea></div></section><aside id="mentor-comments" class="comments-pane" aria-label="文稿评论"><div class="comments-heading">评论</div><div id="mentor-comment-list" class="comments-list"></div></aside></div>
<div id="mentor-status" class="status-line" role="status" aria-live="polite"></div><textarea id="host-conflict" aria-label="未保存的本地文稿" hidden readonly></textarea><section id="host-unapplied" hidden><p id="host-unapplied-reason"></p><textarea id="host-unapplied-content" aria-label="未应用的 AI 输出" readonly></textarea></section></main></div>
<dialog id="mentor-comment-dialog" class="mentor-dialog" aria-labelledby="mentor-comment-title"><div class="dialog-header"><h2 id="mentor-comment-title">评论所选文字</h2><button id="mentor-comment-cancel" class="dialog-close" type="button" aria-label="关闭">×</button></div><blockquote id="mentor-comment-quote"></blockquote><textarea id="mentor-comment-input" rows="4" placeholder="写下你的问题或想法" aria-label="评论内容"></textarea><div class="dialog-actions"><button id="mentor-comment-save" class="primary-action" type="button">保存评论</button></div></dialog>
<script src="vendor/katex/katex.min.js"></script><script src="document.js"></script><script src="bookmarks.js"></script></body></html>
